<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Óvalo Leads - Base de Leads</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Modal API Key -->
  <div id="apikey-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;display:flex;align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:380px;width:90%;text-align:center;">
      <h2 style="margin-bottom:8px;font-size:1.1rem;">Configurar API Key</h2>
      <p style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:16px;">Ingresá tu LEADS_API_KEY para conectar con el servidor.</p>
      <input type="text" id="apikey-input" class="form-input" placeholder="Tu API key..." style="margin-bottom:12px;">
      <button class="btn btn-primary" id="apikey-save" style="width:100%;">Guardar</button>
    </div>
  </div>

  <div class="page-header">
    <h1>Base de Leads</h1>
    <div class="subtitle">Gestión de prospectos Plan Óvalo</div>
  </div>

  <div class="container">
    <input type="text" class="search-bar" id="search-input" placeholder="Buscar por nombre o celular...">

    <div class="filters" id="filters">
      <button class="filter-pill active" data-filter="todos">Todos</button>
      <button class="filter-pill" data-filter="caliente">Caliente</button>
      <button class="filter-pill" data-filter="tibia">Tibia</button>
      <button class="filter-pill" data-filter="fria">Fría</button>
      <button class="filter-pill" data-filter="vendido">Vendido</button>
      <button class="filter-pill" data-filter="baja">Baja</button>
    </div>

    <select class="sort-select" id="sort-select">
      <option value="score">Score &#8595;</option>
      <option value="proximo">Próximo contacto</option>
      <option value="dias_sin">Días sin contacto &#8595;</option>
    </select>

    <div id="leads-list"></div>
  </div>

  <button class="fab" title="Agregar lead (próximamente)">+</button>

  <nav class="nav-bar">
    <a href="/" class="nav-item">
      <span class="nav-icon">&#128197;</span>
      Agenda
    </a>
    <a href="/leads" class="nav-item active">
      <span class="nav-icon">&#128101;</span>
      Leads
    </a>
  </nav>

  <script src="/js/leads.js"></script>
</body>
</html>
