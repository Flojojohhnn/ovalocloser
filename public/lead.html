<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Óvalo Leads - Lead</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Modal API Key -->
  <div id="apikey-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;display:flex;align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:380px;width:90%;text-align:center;">
      <h2 style="margin-bottom:8px;font-size:1.1rem;">Configurar API Key</h2>
      <p style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:16px;">Ingresá tu LEADS_API_KEY para conectar con el servidor.</p>
      <input type="text" id="apikey-input" class="form-input" placeholder="Tu API key..." style="margin-bottom:12px;">
      <button class="btn btn-primary" id="apikey-save" style="width:100%;">Guardar</button>
    </div>
  </div>

  <div class="lead-panel" id="lead-panel">
    <div class="lead-header" id="lead-header">
      <div class="lead-header-top">
        <button class="back-btn" id="back-btn">&#8592;</button>
        <div>
          <div class="lead-name-big" id="lead-name">Cargando...</div>
          <div class="lead-model-subtitle" id="lead-model"></div>
        </div>
        <span class="badge" id="lead-temp-badge"></span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="ficha">Ficha</button>
      <button class="tab" data-tab="historial">Historial</button>
      <button class="tab" data-tab="estado">Estado</button>
    </div>

    <div class="tab-content active" id="tab-ficha"></div>
    <div class="tab-content" id="tab-historial"></div>
    <div class="tab-content" id="tab-estado"></div>
  </div>

  <!-- Chat inferior -->
  <div class="chat-container" id="chat-container">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="chat-input" placeholder="Asentá una novedad, pedí un mensaje de WhatsApp, consultá estrategia...">
      <button class="chat-send" id="chat-send">Enviar</button>
    </div>
  </div>

  <nav class="nav-bar">
    <a href="/" class="nav-item">
      <span class="nav-icon">&#128197;</span>
      Agenda
    </a>
    <a href="/leads" class="nav-item">
      <span class="nav-icon">&#128101;</span>
      Leads
    </a>
  </nav>

  <script src="/js/lead.js"></script>
</body>
</html>
